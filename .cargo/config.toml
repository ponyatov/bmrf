[target.x86_64-unknown-linux-gnu]
# runner = "echo"
[target.aarch64-unknown-linux-gnu]
[target.i686-pc-windows-gnu]
runner = "wine"
[target.i686-unknown-uefi]
runner = "file"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "gdb-multiarch -q -x hw/openocd.gdb"
[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -semihosting-config enable=on,target=native -gdb tcp::12345 -S -kernel"
[target.thumbv7em-none-eabihf]
# runner = "qemu-system-arm -cpu cortex-m4 -machine netduinoplus2 -nographic -semihosting-config enable=on,target=native -gdb tcp::12345 -S -kernel"
runner = "qemu-system-arm -cpu cortex-m4 -machine netduinoplus2 -nographic -semihosting-config enable=on,target=native -gdb tcp::12345 -kernel"
# runner = "arm-none-eabi-size"
# runner = "arm-none-eabi-objdump -x"
# runner = "file"

[target.wasm32-unknown-unknown]
[target.aarch64-linux-android]

[target.i486-pc-bare]
runner = "file"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
# target = ".cargo/i486-pc-bare.json"
# Pick ONE of these compilation targets
# target = "thumbv6m-none-eabi"    # Cortex-M0 and Cortex-M0+
# target = "thumbv7m-none-eabi"    # Cortex-M3
# target = "thumbv7em-none-eabi"   # Cortex-M4 and Cortex-M7 (no FPU)
# target = "thumbv7em-none-eabihf" # Cortex-M4F and Cortex-M7F (with FPU)
# target = "thumbv8m.base-none-eabi"   # Cortex-M23
# target = "thumbv8m.main-none-eabi"   # Cortex-M33 (no FPU)
# target = "thumbv8m.main-none-eabihf" # Cortex-M33 (with FPU)
