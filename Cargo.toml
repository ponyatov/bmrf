[package]
name    = "bmrf"
version = "0.0.1"
authors = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
edition = "2024"

[dependencies]

[target.x86_64-unknown-linux-gnu.dependencies]

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
panic-semihosting = "0.6.0"

[[bin]]
name  = "bmrf"
path  = "src/bmrf.rs"
test  = false
bench = false

[features]
# hw
netduinoplus2 = ["stm32f405rg"]
iskra         = ["stm32f405rg"]
f4disco       = ["stm32f407vg"]
f429disco     = ["stm32f429zi"]
pillF103      = ["stm32f103"]
# cpu
stm32f103   = ["stm32f1"]
stm32f405rg = ["stm32f4"]
stm32f407vg = ["stm32f4"]
stm32f429zi = ["stm32f4"]
# series
stm32f1 = ["cortexM"]
stm32f4 = ["cortexM"]
# arch
cortexM = ["bare"]
# os
linux = []
bare  = []
